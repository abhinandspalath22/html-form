<html>
    <head>
        <title> Form </title>
    </head>
    <body bgcolor="#FFDAB9">
        <H1><CEnter>Student Registration Form</CEnter></H1>
        <form action=""> 
            <label for="Roll no.:">Roll no. :</label>
            <input type="text"id="roll" name="roll">
            <br> <br>

            <label for="Student name :">Student name :</label>
            <input type="text" name="fname" id="fname" placeholder="First Name">
            <input type="text" name="lname" id="lname" placeholder="Last Name">
            <br><br>

            <label for="Father Name">Father's Name :</label>
            <input type="text" name="father" id="father">
            <br><br>

            <label for="Date of birth">Date of birth :</label>
            <input type="number" name="day" id="day" placeholder="Day" size="4">
            <input type="number" name="month" id="month" placeholder="Month" size="4">
            <input type="number" name="year" id="year" placeholder="Year" size="4"> (DD-MM-YY)
            <br><br>

            <label for="mobile no.">Mobile no. :</label>
            <input type="number" name="mobile id" id="mobile id" placeholder="+91" size="2">
            <input type="number" name="mobile id" id="mobile id" size="5">
            <br><br>

            <label for="email id">Email id :</label>
            <input type="text" name="email id" id="email id">
            <br><br>

            <label for="password">Password :</label>
            <input type="text" name="password id" id="password">
            <br><br>

            <label for="gender">Gender :</label>
            <input type="radio" name="gender" id="gender" > Male
            <input type="radio" name="gender" id="gender"> Female
            <br><br>

            <label for="department">Department :</label>
            <input type="checkbox" name="dep id" id="dep id"> CSE
            <input type="checkbox" name="dep id" id="dep id"> IT
            <input type="checkbox" name="dep id" id="dep id"> ECE
            <input type="checkbox" name="dep id" id="dep id"> Civil
            <input type="checkbox" name="dep id" id="dep id"> Mech
            <br><br>

            <label for="course">Course :</label>
             <select name="course" id="course">
              <option value="">select course</option>
              <option value="bca">BCA</option>
              <option value="mca">MCA</option>
              <option value="btech">BTECH</option>
              <option value="mtech">MTECH</option>  
             </select>
            <br><br>

            <label for="student photo">Student photo :</label>
            <input type="file" name="" id="">
            <br><br>

            <label for="city">City :</label>
            <input type="text">
            <br><br>

            <label for="address">Adress :</label>
            <textarea name="adress" id="adress"></textarea>
            <br><br>

            <input type="submit" value="Register">



        </form>
        
    </body>
</html>
